[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plancheck"
version = "0.1.0"
description = "Agentic floor-plan compliance checker: a vision-language model reads the plan, exact geometry checks the rules."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "langgraph>=1.0",
  "langchain>=1.0",
  "langchain-core>=1.0",
  "pydantic>=2.6",
  "shapely>=2.0",
  "networkx>=3.2",
  "numpy>=1.26",
  "pillow>=10.0",
  "matplotlib>=3.8",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic>=1.0"]
openai = ["langchain-openai>=1.0"]
google = ["langchain-google-genai>=2.0"]
dev = ["pytest>=8.0"]

[project.scripts]
plancheck = "plancheck.cli:main"

[tool.setuptools.packages.find]
include = ["plancheck*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
